name: Store checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  firebase-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npm run build:editor
      - run: git diff --exit-code -- assets/dist
      - run: npm test
